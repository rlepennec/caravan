<div class="masque-item">

    <input
        class="name"
        name="name"
        type="text"
        value="{{item.name}}"/>

    <div class="header">

        <img
            src="{{item.img}}"
            title="{{item.name}}"
            data-edit="img"
            data-action="editImage"
            class="left"/>

        <div class="middle">

            <div class="description">
                <prose-mirror
                    name="system.description"
                    button="true"
                    editable="{{editable}}"
                    toggled="false"
                    value="{{system.description}}">
                    {{{enrichedDescription}}}
                </prose-mirror>
            </div>

            <div class="trait">
                <label class="nom">Trait</label>
                <input
                    name="system.trait"
                    value="{{system.trait}}"
                    type="text"
                    data-dtype="String"
                    class="valeur"/>

            </div>

        </div>

        <img
            src="{{item.system.img}}"
            title="{{item.name}}"
            data-edit="system.img"
            data-action="editImage"
            class="right"/>

    </div>


    <div class="voie">

        <input
            name="system.voie.1.nom"
            value="{{system.voie.1.nom}}"
            type="text"
            data-dtype="String"
            placeholder="Voie"
            class="nom"/>

        <div class="pouvoir">

            <div class="titre">

                <label>1.</label>

                <input
                    name="system.voie.1.pouvoir.1.nom"
                    value="{{system.voie.1.pouvoir.1.nom}}"
                    type="text"
                    data-dtype="String"
                    placeholder="Pouvoir"/>

            </div>

            <textarea
                class="description"
                autocomplete="off"
                name="system.voie.1.pouvoir.1.description">{{system.voie.1.pouvoir.1.description}}</textarea>

        </div>

        <div class="pouvoir">

            <div class="titre">

                <label>2.</label>

                <input
                    name="system.voie.1.pouvoir.2.nom"
                    value="{{system.voie.1.pouvoir.2.nom}}"
                    type="text"
                    data-dtype="String"
                    placeholder="Pouvoir"/>

            </div>

            <textarea
                class="description"
                autocomplete="off"
                name="system.voie.1.pouvoir.2.description">{{system.voie.1.pouvoir.2.description}}</textarea>

        </div>

        <div class="pouvoir">

            <div class="titre">

                <label>3.</label>

                <input
                    name="system.voie.1.pouvoir.3.nom"
                    value="{{system.voie.1.pouvoir.3.nom}}"
                    type="text"
                    data-dtype="String"
                    placeholder="Pouvoir"/>

            </div>

            <textarea
                class="description"
                autocomplete="off"
                name="system.voie.1.pouvoir.3.description">{{system.voie.1.pouvoir.3.description}}</textarea>

        </div>

    </div>

    <div class="voie">

        <input
            name="system.voie.2.nom"
            value="{{system.voie.2.nom}}"
            type="text"
            data-dtype="String"
            placeholder="Voie"
            class="nom"/>

        <div class="pouvoir">

            <div class="titre">

                <label>1.</label>

                <input
                    name="system.voie.2.pouvoir.1.nom"
                    value="{{system.voie.2.pouvoir.1.nom}}"
                    type="text"
                    data-dtype="String"
                    placeholder="Pouvoir"/>

            </div>

            <textarea
                class="description"
                autocomplete="off"
                name="system.voie.2.pouvoir.1.description">{{system.voie.2.pouvoir.1.description}}</textarea>

        </div>

        <div class="pouvoir">

            <div class="titre">

                <label>2.</label>

                <input
                    name="system.voie.2.pouvoir.2.nom"
                    value="{{system.voie.2.pouvoir.2.nom}}"
                    type="text"
                    data-dtype="String"
                    placeholder="Pouvoir"/>

            </div>

            <textarea
                class="description"
                autocomplete="off"
                name="system.voie.2.pouvoir.2.description">{{system.voie.2.pouvoir.2.description}}</textarea>

        </div>

        <div class="pouvoir">

            <div class="titre">

                <label>3.</label>

                <input
                    name="system.voie.2.pouvoir.3.nom"
                    value="{{system.voie.2.pouvoir.3.nom}}"
                    type="text"
                    data-dtype="String"
                    placeholder="Pouvoir"/>

            </div>

            <textarea
                class="description"
                autocomplete="off"
                name="system.voie.2.pouvoir.3.description">{{system.voie.2.pouvoir.3.description}}</textarea>

        </div>

    </div>

</div>
